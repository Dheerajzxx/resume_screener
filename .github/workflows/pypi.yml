name: PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build distribution
    runs-on: macos-26
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify tag matches the app version
        run: |
          python - <<'PY'
          import os
          from core import __version__

          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if tag != __version__:
              raise SystemExit(
                  f"Tag {tag!r} does not match __version__ {__version__!r}"
              )
          print(f"Publishing Resume Screener {__version__}")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt build twine

      - name: Run tests
        run: python -m pytest -q

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata
        run: python -m twine check --strict dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pypi-dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/resume-screener
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v7
        with:
          name: pypi-dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
