name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish arm64 release
    runs-on: macos-26
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify arm64 runner
        run: test "$(uname -m)" = "arm64"

      - name: Verify tag matches the app version
        run: |
          python - <<'PY'
          import os
          from core import __version__

          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if tag != __version__:
              raise SystemExit(
                  f"Tag {tag!r} does not match __version__ {__version__!r}"
              )
          print(f"Releasing Resume Screener {__version__}")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build macOS app
        run: ./build_app.sh

      - name: Package release asset
        run: |
          mkdir -p release
          asset="Resume-Screener-${GITHUB_REF_NAME}-macOS-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Resume Screener.app" "release/${asset}"
          (cd release && shasum -a 256 "${asset}" > SHA256SUMS.txt)
          cp LICENSE THIRD_PARTY_NOTICES.md release/
          cp -R licenses release/
          cat "release/SHA256SUMS.txt"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: resume-screener-${{ github.ref_name }}
          path: release/
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<EOF
          ## Resume Screener ${GITHUB_REF_NAME}

          macOS arm64 build. Download the zip, unzip it, and move
          \`Resume Screener.app\` wherever you like.

          **Unsigned build:** on another Mac, right-click the app and choose
          Open the first time (or sign and notarize it for wider distribution).

          SHA-256 checksums are attached as \`SHA256SUMS.txt\`. The MIT license,
          third-party notices, and full AGPL/LGPL texts are attached separately;
          review \`THIRD_PARTY_NOTICES.md\` before redistributing the app. See
          \`CHANGELOG.md\` in the repository for details.
          EOF
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              release/*.zip release/SHA256SUMS.txt \
              release/LICENSE release/THIRD_PARTY_NOTICES.md \
              release/licenses/*.txt --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              release/*.zip release/SHA256SUMS.txt \
              release/LICENSE release/THIRD_PARTY_NOTICES.md \
              release/licenses/*.txt \
              --title "Resume Screener ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
