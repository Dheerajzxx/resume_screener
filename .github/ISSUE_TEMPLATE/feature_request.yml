name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem first, then the behavior you would like.
        This helps distinguish a real workflow gap from a preferred solution.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      placeholder: "I process several hundred resumes and need..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds, other tools, or simpler options.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Keywords and scoring
        - PDF extraction or OCR
        - Results table
        - Shortlisting
        - CSV or other exports
        - User interface or theme
        - Packaging or installation
        - Documentation
        - Other

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for a similar request.
          required: true
